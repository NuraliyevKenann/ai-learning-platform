[project]
name = "ai-learning-platform-backend"
version = "0.1.0"
description = "FastAPI backend for the AI Learning Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.13.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
